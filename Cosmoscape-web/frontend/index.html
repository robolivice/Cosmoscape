<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
	<title>Universe Map</title>
	<link rel="stylesheet" href="static/styles.css">
</head>

<body>
	<button onclick="syncData()" class="xbutton" id="main-btn">Sync Real Data</button>
	<div id="ui">
		<h2>Universe Navigator</h2>
		<div id="status">Verifying data systems...</div>
		<div class="galaxy"></div>
		<div id="search-container">
			<div class="nebula"></div>
			<div class="starfield"></div>
			<div class="cosmic-dust"></div>
			<div class="cosmic-dust"></div>
			<div class="cosmic-dust"></div>

			<div class="stardust"></div>

			<div class="cosmic-ring"></div>

			<div id="main">
				<input id="search" class="input" name="text" type="text" placeholder="Search star..."
					autocomplete="off" />
				<div id="input-mask"></div>
				<div id="cosmic-glow"></div>
				<div id="wormhole-icon">
				</div>
				<div id="search-icon">
					<svg stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="url(#cosmic-search)"
						fill="none" height="24" width="24" viewBox="0 0 24 24">
						<circle r="8" cy="11" cx="11"></circle>
						<line y2="16.65" x2="16.65" y1="21" x1="21"></line>
						<defs>
							<linearGradient gradientTransform="rotate(45)" id="cosmic-search">
								<stop stop-color="#a9c7ff" offset="0%"></stop>
								<stop stop-color="#6e8cff" offset="100%"></stop>
							</linearGradient>
						</defs>
					</svg>
				</div>
			</div>
		</div>

		<div id="results"></div>
		<label class="checkbox-wrapper" style="margin-top: 5px;">
			<input type="checkbox" id="show-names" />
			<div class="checkmark">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
					<path d="M20 6L9 17L4 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</div>
			<span class="label">Show All Star Names</span>
		</label>
		<label class="checkbox-wrapper" style="margin-top: -6px;">
			<input type="checkbox" id="true-scale" />
			<div class="checkmark">
				<svg viewBox="0, 0, 24, 24" fill="none" stroke="currentColor">
					<path d="M20 6L9 17L4 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</div>
			<span class="label" style="font-size: 15px;">True Scale (Alpha Centauri)</span>
		</label>
		<div id="time-ui" style="display:none; margin-top:8px; font-size:0.85rem; color:#94a3b8">
			Time: <span id="time-label">1x</span>
			<label style="margin-left:8px"><input type="checkbox" id="pause-time"> Pause</label>
			<input type="range" id="time-slider" min="-1" max="3" step="0.05" value="0" style="width:100%">
		</div>
	</div>
	<button id="back-btn" class="xbutton hide" onclick="exitGalaxy()">⬅ Back to galaxies</button>

	<div id="labels">
		<div id="tip" class="lbl" style="display:none"><span class="nm"></span></div>
		<div id="pin" class="lbl t1" style="display:none"><span class="ring"></span><span class="nm"></span></div>
	</div>

	<div id="info-panel">
		<span class="close-btn" onclick="document.getElementById('info-panel').style.display='none'">✕</span>
		<h2 id="star-name"></h2>
		<div id="markdown-body"></div>
		<textarea id="md-editor"></textarea>
		<div id="panel-actions">
			<button id="edit-btn" onclick="startEdit()">✏️ Edit Records</button>
			<button id="save-btn" onclick="saveRecords()" style="display:none">💾 Save</button>
			<button id="cancel-btn" onclick="exitEdit()" style="display:none; background:#475569">Cancel</button>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
	<script type="importmap">
	{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js" } }
	</script>
	<script type="module">
		import * as T from 'three';
		import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/controls/OrbitControls.js';
		import { KTX2Loader } from 'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/loaders/KTX2Loader.js';

		window.THREE = { ...T, OrbitControls, KTX2Loader };

		const s = document.createElement('script');
		s.src = 'static/scripts.js';
		document.body.appendChild(s);
</script>
</body>
</html>
